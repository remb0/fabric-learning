  <script>
    'use strict';
    const DP700_QUESTIONS = [{"id":"b01","domain":"beheer","topic":"Toegangsbeheer","level":"Basis","stem":"Een analist moet rapporten bekijken in een Fabric-workspace maar geen items kunnen aanmaken of aanpassen. Welke workspace-rol is het meest passend?","options":["Admin","Member","Contributor","Viewer"],"correct":[3],"explanation":"Viewer is bedoeld voor consumenten die bestaande inhoud mogen bekijken zonder deze te bewerken. Admin, Member en Contributor hebben meer beheer- of wijzigingsrechten. Controleer daarnaast de toegang tot onderliggende data: de Viewer-rol geeft niet automatisch toegang tot alle tabellen.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b02","domain":"beheer","topic":"Toegangsbeheer","level":"Gevorderd","stem":"Een gebruiker heeft de Contributor-rol op de workspace. Je maakt een OneLake-rol die slechts één tabel toestaat. Welke uitspraak past bij de huidige beveiligingsarchitectuur?","options":["De rol filtert alle Spark-notebooks, ongeacht wie deze uitvoert","De Contributor behoudt brede datatoegang via zijn workspace-rechten","De Contributor kan geen Delta-tabellen meer schrijven","De rol verandert automatisch de workspace-rol naar Viewer"],"correct":[1],"explanation":"Bij OneLake security zijn fijnmazige rollen vooral bedoeld voor gebruikers met Viewer- of item-Read-toegang. Admins, Members en Contributors beschikken via hun hogere workspace-rechten over brede datatoegang. Geef gevoelige-data-afnemers daarom niet onnodig een schrijvende workspace-rol.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b03","domain":"beheer","topic":"Toegangsbeheer","level":"Gevorderd","stem":"Welke eigenschappen gelden voor OneLake security-rollen? Selecteer alle juiste antwoorden.","options":["Een rol kan leesrechten op specifieke tabellen of mappen verlenen","Een rol kan rijen en kolommen beperken wanneer de toegangsmethode dit ondersteunt","Een Deny-rol kan alle hogere workspace-rechten afdwingen te blokkeren","Een rol heeft leden, permissies en een gegevensscope"],"correct":[0,1,3],"explanation":"OneLake security werkt met Grant-rollen die toegang verlenen op een geselecteerde scope en optioneel rij-/kolomfilters toepassen. Er is geen algemene Deny-rol die hogere schrijfrechten wegneemt. Controleer ook het toegangspad: sommige operaties worden geweigerd wanneer filtering niet veilig kan worden toegepast.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b04","domain":"beheer","topic":"Toegangsbeheer","level":"Basis","stem":"Een regiomanager mag uitsluitend orderregels zien uit regio Zuid. Welke techniek regelt precies dit soort filtering?","options":["Workspace-itemrechten","Column-Level Security","Row-Level Security","Dynamic Data Masking"],"correct":[2],"explanation":"Row-Level Security (RLS) beperkt de rijen die een gebruiker ziet op basis van beleid, bijvoorbeeld Region = Zuid. Column-Level Security beperkt kolommen, Object-Level Security objecten, en sensitivity labels classificeren gegevens.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b05","domain":"beheer","topic":"Toegangsbeheer","level":"Basis","stem":"Een werknemer mag de tabel Werknemers raadplegen, maar mag de kolom BSN niet lezen. Welke beveiliging past het best?","options":["Column-Level Security","Object-Level Security op de tabel","Row-Level Security op de tabel","Dynamic Data Masking op de kolom"],"correct":[0],"explanation":"Column-Level Security voorkomt dat gebruikers een specifieke kolom kunnen lezen. Met RLS beperk je rijen, niet de kolom zelf. Masking kan presentatie beperken maar is geen equivalent van een toegangsverbod.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b06","domain":"beheer","topic":"Toegangsbeheer","level":"Basis","stem":"Een gebruiker mag geen enkel object in een gevoelig schema kunnen benaderen. Welke beveiligingscategorie komt het dichtst in de buurt?","options":["Row-Level Security op alle tabellen","Object-Level Security","Column-Level Security op alle tabellen","Dynamic Data Masking op alle tabellen"],"correct":[1],"explanation":"Object-Level Security bepaalt of objecten, bijvoorbeeld tabellen of views, zichtbaar en toegankelijk zijn. RLS beperkt de records binnen een object en CLS specifieke kolommen. Het beveiligingsmechanisme moet passen bij het gevraagde toegangsniveau.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b07","domain":"beheer","topic":"Toegangsbeheer","level":"Gevorderd","stem":"Je wilt alleen de map Files/Public toegankelijk maken voor een groep die toegang heeft tot een Lakehouse. Waar stel je dit primair in?","options":["SQL GRANT SELECT op de hele tabel","Via OneLake security met map-/bestandsscope","Een werkruimterol Contributor met een padfilter","Een sensitivity label op de bestandsnaam"],"correct":[1],"explanation":"OneLake security kan voor ondersteunde items toegang verlenen op map- en tabelscope. Daarmee scheid je bestanden op basis van autorisatie. Spark-instellingen en Query Insights regelen compute en monitoring en geen folderautorisatie.","source":"https://learn.microsoft.com/en-us/fabric/onelake/security/fabric-onelake-security"},{"id":"b08","domain":"beheer","topic":"Gegevensbescherming","level":"Examenniveau","stem":"Bij een query wordt het e-mailadres getoond als deels verborgen tekst. Een auditor vraagt of dit gelijkstaat aan het blokkeren van leesrechten op de oorspronkelijke kolom. Wat antwoord je?","options":["Ja, masking en CLS zijn identiek","Ja, masking versleutelt altijd de bronwaarde","Nee, masking wijzigt de presentatie en vervangt geen toegangsbeveiliging","Nee, want masking is uitsluitend mogelijk in notebooks"],"correct":[2],"explanation":"Dynamic Data Masking verandert de getoonde waarde voor gebruikers die aan de maskingregel zijn onderworpen. Het verwijdert of versleutelt de oorspronkelijke data niet en is geen volledige bescherming tegen ongeautoriseerde analyse. Voor het afdwingen van kolomtoegang gebruik je passende permissies of CLS.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b09","domain":"beheer","topic":"Gegevensbescherming","level":"Basis","stem":"Je wilt een Fabric-item classificeren als Vertrouwelijk voor informatiebescherming. Welke functie kies je?","options":["Sensitivity label","Endorsement als Certified","OneLake-role op de gehele map","Item-permission Read"],"correct":[0],"explanation":"Sensitivity labels geven de gevoeligheidsclassificatie van gegevens weer en ondersteunen informatiebeschermingsbeleid. Endorsement zegt iets over betrouwbaarheid of aanbevolen gebruik van een item, niet over de vertrouwelijkheid ervan.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b10","domain":"beheer","topic":"Gegevensbescherming","level":"Gevorderd","stem":"De organisatie wil dat gebruikers herkennen welke datasets officieel zijn gevalideerd en aanbevolen. Welke Fabric-governancefunctie is hiervoor bedoeld?","options":["Sensitivity labels als Vertrouwelijk","Endorsement met Certified-status","Workspace-rol Viewer","Lineage-registratie"],"correct":[1],"explanation":"Endorsement helpt consumenten vertrouwde items te herkennen, bijvoorbeeld via Promoted en Certified. Certified duidt op formele goedkeuring volgens het governanceproces van de organisatie; dit is iets anders dan een sensitivity label.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b11","domain":"beheer","topic":"Governance","level":"Gevorderd","stem":"Je onderzoekt welke downstream-rapporten geraakt worden als een brondataflow wijzigt. Welk overzicht helpt het meest?","options":["De querygeschiedenis van het Warehouse","Lineage view","Capacity Metrics app","Auditlog met gebruikeracties"],"correct":[1],"explanation":"Lineage laat afhankelijkheden en datastromen zien tussen bronnen en consumenten. Hiermee kun je een impactanalyse uitvoeren voordat je een upstream-item wijzigt. Monitoring en masking behandelen andere aspecten.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b12","domain":"beheer","topic":"Versiebeheer","level":"Basis","stem":"Een team wil branches, wijzigingsgeschiedenis en pull requests voor Fabric-itemdefinities. Wat is de primaire techniek?","options":["Fabric Git Integration","Deployment Pipelines","Fabric workspace exports","Warehouse database projects zonder repository"],"correct":[0],"explanation":"Git Integration koppelt ondersteunde Fabric-itemdefinities aan een repository voor versionering en samenwerking. Het is geen mechanismen voor het bewaren van alle Lakehouse-data of het automatisch promoten van productie-items.","source":"https://learn.microsoft.com/en-us/fabric/cicd/git-integration/intro-to-git-integration"},{"id":"b13","domain":"beheer","topic":"Versiebeheer","level":"Basis","stem":"Een team wil de geteste versie van een Fabric-oplossing van Test naar Productie promoveren. Welke functie past het best?","options":["Git-branch maken","Warehouse OPTIMIZE","Deployment Pipeline","Een branch-pullrequest goedkeuren"],"correct":[2],"explanation":"Deployment Pipelines beheren de promotie van ondersteunde Fabric-items tussen levenscyclusfasen. Git beheert versiegeschiedenis en samenwerkingsbranches. De twee vullen elkaar aan en vervangen elkaar niet.","source":"https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/intro-to-deployment-pipelines"},{"id":"b14","domain":"beheer","topic":"Versiebeheer","level":"Examenniveau","stem":"In Test en Productie bestaan twee losse Fabric-items met dezelfde naam en hetzelfde type. Ze zijn niet gekoppeld in de deployment pipeline. Wat is het risico bij deployment?","options":["Een automatische merge op basis van gelijknamige items","Het niet-gekoppelde item kan als extra item worden aangemaakt","De bestaande itemdefinitie wordt altijd vervangen","De bron- en doelworkspaces worden automatisch samengevoegd"],"correct":[1],"explanation":"Bij deployment gebruikt Fabric item-pairing om doelitems aan bronitems te koppelen. Hetzelfde naam/type is niet voldoende om te garanderen dat een bestaand item wordt overschreven; zonder pairing kan een duplicaat ontstaan. Controleer de koppelingen vooraf.","source":"https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/intro-to-deployment-pipelines"},{"id":"b15","domain":"beheer","topic":"Versiebeheer","level":"Gevorderd","stem":"Een Warehouse-team wil SQL-schemaobjecten versieerbaar ontwikkelen en gecontroleerd uitrollen. Welk artefact past hierbij?","options":["Warehouse database project","T-SQL stored procedure zonder bronbeheer","Git-branch zonder SQL-objectdefinities","OneLake Shortcut naar de tabel"],"correct":[0],"explanation":"Database projects helpen SQL-objectdefinities als code te beheren en om wijzigingen gecontroleerd te implementeren. Shortcuts verwijzen naar opgeslagen data; ze versiebeheren geen Warehouse-schema.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b16","domain":"beheer","topic":"Versiebeheer","level":"Gevorderd","stem":"Een deployment van Test naar Productie moet andere verbindingswaarden en omgevingsparameters gebruiken. Welke aanpak is geschikt?","options":["Per omgeving handmatig teksten in notebooks wijzigen","Per omgeving variabelen en ondersteunde deploymentregels configureren","Voor alle stages exact dezelfde connection string afdwingen","Na deployment de productie-items verwijderen en opnieuw maken"],"correct":[1],"explanation":"Omgevingsspecifieke waarden horen in beheerbare configuratie, bijvoorbeeld variable libraries en ondersteunde deploymentregels. Hardcoding en onnodige adminrechten vergroten risico op fouten en onbedoelde toegang. Controleer welke itemeigenschappen door jouw itemtype worden ondersteund.","source":"https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/intro-to-deployment-pipelines"},{"id":"b17","domain":"beheer","topic":"Spark configuratie","level":"Gevorderd","stem":"Nieuwe Fabric-workspaces gebruiken de actuele standaard Spark-runtime. Welke stelling over Runtime 2.0 is juist?","options":["Runtime 2.0 is de standaard maar biedt alleen Scala","Runtime 2.0 is de standaard voor nieuwe workspaces en bevat Apache Spark 4.1","Runtime 2.0 is alleen bedoeld voor Azure Databricks","Runtime 2.0 heeft geen Python-ondersteuning"],"correct":[1],"explanation":"Microsoft documenteert Runtime 2.0 als de standaard voor nieuwe workspaces en Environments, met Spark 4.1 en Python 3.13. Bij een bestaande workload moet je bibliotheken en compatibiliteit testen voordat je de runtime verandert.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/runtime-2-0"},{"id":"b18","domain":"beheer","topic":"Spark configuratie","level":"Gevorderd","stem":"Verschillende notebooks moeten dezelfde vastgelegde bibliotheken en een afwijkende runtimeconfiguratie gebruiken. Welke Fabric-functie helpt dit reproduceerbaar te maken?","options":["Environment item","Workspace-itemhernoeming","Notebook-outputcaching","OneLake role assignment"],"correct":[0],"explanation":"Een Fabric Environment beheert onder andere runtimekeuze, libraries en Spark-configuratie voor gekoppelde notebooks en Spark jobs. Daarmee maak je een gecontroleerde, herhaalbare uitvoeringsomgeving.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/runtime-2-0"},{"id":"b19","domain":"beheer","topic":"Spark configuratie","level":"Examenniveau","stem":"Een Spark-workload varieert in actieve taken. Je wilt dat Spark het aantal executors op basis van belasting dynamisch bijstuurt. Welk mechanisme richt zich daarop?","options":["Dynamic allocation","Spark pool autoscale als synoniem voor executorallocatie","High concurrency session sharing","Warehouse compute scaling"],"correct":[0],"explanation":"Dynamic allocation laat Spark executors aanvragen of vrijgeven afhankelijk van de actieve workload. Dat is iets anders dan de bredere autoscale- en poolcapaciteitsinstellingen. De effectieve werking hangt af van de beschikbare Fabric-configuratie.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b20","domain":"beheer","topic":"Spark configuratie","level":"Gevorderd","stem":"Een team voert veel kleine notebooks gelijktijdig uit. Het opstarten van aparte Spark-sessies veroorzaakt overhead. Welke Fabric-optie kan in een ondersteund scenario helpen?","options":["High concurrency mode","Dynamic allocation van executors","Standaard Spark job retry-policy","Partition pruning in Delta"],"correct":[0],"explanation":"High concurrency kan compatibele notebookuitvoeringen een gedeelde Spark-sessie laten gebruiken, waardoor startkosten worden beperkt. Dit is vooral relevant bij geschikte gelijktijdige notebookworkloads; het vervangt geen capaciteit en werkt niet voor alle scenario’s.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b21","domain":"beheer","topic":"Workspace inrichting","level":"Basis","stem":"Een grote organisatie wil Fabric-workspaces logisch groeperen per bedrijfsdomein, zoals Finance en Operations, en governance delegeren. Wat gebruik je?","options":["Domains","Workspace folders","Deployment stages","OneLake table schemas"],"correct":[0],"explanation":"Domains ondersteunen de organisatie van Fabric-content per bedrijfsdomein en helpen bij gedistribueerde governance. Ze zijn geen opslagpartitie of uitvoeringsmechanisme.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b22","domain":"beheer","topic":"Orchestration","level":"Basis","stem":"Je moet elk uur data kopiëren, daarna een notebook uitvoeren en na succes een stored procedure starten. Welke hoofdfunctie gebruik je?","options":["Een notebook plannen en de rest als losse procedures uitvoeren","Een Data Pipeline met afhankelijke activiteiten","Een Dataflow Gen2 met één query zonder scheduling","Een Warehouse-view die de activiteiten triggert"],"correct":[1],"explanation":"Een Data Pipeline orkestreert activiteiten en hun afhankelijkheden, eventueel met scheduling en retries. De notebook en stored procedure voeren elk de inhoudelijke verwerking uit. Een shortcut is een verwijzing naar data, geen workflowplanner.","source":"https://learn.microsoft.com/en-us/fabric/data-factory/parameters"},{"id":"b23","domain":"beheer","topic":"Orchestration","level":"Gevorderd","stem":"Een ingestieproces moet starten zodra een geschikt opslag-event binnenkomt, niet elke nacht. Wat kies je?","options":["Fixed-interval scheduletrigger","Event-based trigger","Manuele pipeline-run met ingevoerde datum","Trigger op een handmatige deployment"],"correct":[1],"explanation":"Een event-based trigger start de workflow op basis van een ondersteunde gebeurtenis. Een schedule trigger werkt op tijdstippen. Controleer de ondersteunde events en mogelijke vertraging bij de gekozen Fabric-configuratie.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b24","domain":"beheer","topic":"Orchestration","level":"Gevorderd","stem":"Een pipeline heeft de parameter LoadDate. Welke dynamische expressie leest de parameterwaarde?","options":["@activity().LoadDate","@pipeline().parameters.LoadDate","@item().workspace.LoadDate","@trigger().table.LoadDate"],"correct":[1],"explanation":"In Fabric pipeline-expressies verwijst @pipeline().parameters.<naam> naar een pipelineparameter. Je kunt daarmee dezelfde pipeline voor verschillende datums laten uitvoeren zonder de definitie te wijzigen.","source":"https://learn.microsoft.com/en-us/fabric/data-factory/parameters"},{"id":"b25","domain":"beheer","topic":"Orchestration","level":"Examenniveau","stem":"Een activiteit geeft tijdelijk HTTP 429 vanwege throttling. Welke combinatie is in eerste instantie verstandig?","options":["Maximale paralleliteit instellen en retries uitschakelen","Retries met passende wachttijd plus concurrency beperken","De pipeline zonder wachttijd eindeloos laten herhalen","Alle activiteitstaken tegelijk opnieuw starten"],"correct":[1],"explanation":"HTTP 429 betekent dat het systeem te veel aanvragen ontvangt. Met retries en backoff vang je tijdelijke limieten op; door gelijktijdigheid te begrenzen pak je de structurele belasting aan. Een retry moet wel veilig zijn bij heruitvoering.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b26","domain":"beheer","topic":"Orchestration","level":"Examenniveau","stem":"Een pipeline kan na een time-out opnieuw starten. Welke eigenschap voorkomt ongewenste dubbele factrecords?","options":["Idempotent laadontwerp","Meer parallelle copy-activiteiten","Alleen een grotere batchsize","Een hoge retry-count zonder deduplicatie"],"correct":[0],"explanation":"Idempotentie betekent dat herhaald uitvoeren dezelfde bedoelde eindtoestand oplevert. Denk aan deduplicatie op business keys, conditionele MERGE en een checkpoint/watermark die pas na succesvol committen wordt bijgewerkt.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b27","domain":"beheer","topic":"Orchestration","level":"Gevorderd","stem":"Een pipelineactiviteit kan slagen of falen. Welke functies helpen de volgende stap afhankelijk van de uitkomst te bepalen? Selecteer alle juiste antwoorden.","options":["Success- en Failure-afhankelijkheden","Conditionele uitvoeringspaden in de pipeline","Pipelinevariabelen of expressies voor beslislogica","Alleen de tabelnaam veranderen"],"correct":[0,1,2],"explanation":"De orchestrationlaag gebruikt dependency-uitkomsten en conditionele logica om vervolgactiviteiten, foutafhandeling en meldingen te bepalen. Alleen een nieuwe tabelnaam heeft geen effect op de control flow.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b28","domain":"beheer","topic":"Orchestration","level":"Gevorderd","stem":"Een team wil een ETL-proces volledig als Python-DAG definiëren met taakafhankelijkheden. Welke Fabric-mogelijkheid past het best?","options":["Apache Airflow-workflow","Fabric Dataflow Gen2 Power Query","Eventstream-processing editor","Warehouse T-SQL query view"],"correct":[0],"explanation":"Apache Airflow is bedoeld voor code-first orchestration van workflows als DAG met taken en afhankelijkheden. Fabric pipelines bieden een meer visuele orchestration-ervaring; beide zijn taakplanners en niet automatisch de engine die elke transformatie zelf uitvoert.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b29","domain":"beheer","topic":"Governance","level":"Examenniveau","stem":"Bij een compliancecontrole moet je nagaan welke gebruikers acties hebben uitgevoerd op Fabric-items. Welk type bron is daarvoor het meest geschikt?","options":["Auditlogs","Lineage view","Query Insights","Monitoring Hub"],"correct":[0],"explanation":"Auditlogs zijn bedoeld om activiteiten en wijzigingen te reconstrueren voor beveiliging en compliance. Lineage toont gegevensafhankelijkheden en Spark-statistieken prestaties; die beantwoorden niet wie welke beheeractie uitvoerde.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"b30","domain":"beheer","topic":"Versiebeheer","level":"Examenniveau","stem":"Welke uitspraken over deployment van Fabric-items zijn juist? Selecteer alle juiste antwoorden.","options":["Deployment kopieert ondersteunde itemdefinities tussen stages","Je moet per itemtype controleren welke eigenschappen worden meegenomen","Deployment garandeert dat alle onderliggende historische data worden gekopieerd","Een deployment pipeline kan uit meer dan drie stages bestaan"],"correct":[0,1,3],"explanation":"Deployment Pipelines verplaatsen ondersteunde content en definities; databeschikbaarheid en omgevingsconfiguratie moet je apart beoordelen. Microsoft ondersteunt twee tot tien stages, waarbij Development, Test en Production slechts de gebruikelijke standaardindeling is.","source":"https://learn.microsoft.com/en-us/fabric/cicd/deployment-pipelines/intro-to-deployment-pipelines"},{"id":"d01","domain":"data","topic":"Dataarchitectuur","level":"Basis","stem":"Een oplossing verwerkt semi-gestructureerde bronbestanden op grote schaal met PySpark en bewaart ze als Delta-tabellen. Welke opslag/engine-combinatie is het meest logisch?","options":["Lakehouse met Spark","Warehouse met T-SQL als enige verwerking","Eventhouse met KQL-transformaties","Dataflow Gen2 met Power Query als enige engine"],"correct":[0],"explanation":"Een Lakehouse combineert flexibele dataopslag met Spark-transformaties en Delta-tabellen. Een Warehouse is vooral sterk in SQL-gebaseerde analytische opslag; Eventhouse richt zich op snelle KQL-eventanalyse.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint"},{"id":"d02","domain":"data","topic":"Dataarchitectuur","level":"Basis","stem":"In een Fabric Lakehouse wil je de onderliggende Delta-rijen bijwerken. Waarmee kan dat?","options":["UPDATE via Lakehouse SQL Analytics Endpoint","Spark Notebook dat naar de Delta-tabel schrijft","KQL project op het SQL endpoint","Een Power BI-sensitivity label"],"correct":[1],"explanation":"Het Lakehouse SQL Analytics Endpoint biedt read-only T-SQL-querytoegang tot Delta-data. Voor INSERT, UPDATE en DELETE gebruik je een schrijvende engine zoals Spark; Warehouse ondersteunt wel T-SQL DML op zijn eigen tabellen.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-sql-analytics-endpoint"},{"id":"d03","domain":"data","topic":"Dataarchitectuur","level":"Basis","stem":"Wat is het belangrijkste onderscheid tussen OneLake en een Fabric Capacity?","options":["OneLake is de logische beheereenheid voor Spark-jobs; Capacity bewaart tabellen","OneLake is opslag; Capacity levert rekenresources","OneLake en Capacity zijn twee typen compute pools","OneLake beheert runtimeversies; Capacity verzorgt data lineage"],"correct":[1],"explanation":"OneLake is de centrale opslaglaag waar data in verschillende Fabric-itemtypen wordt georganiseerd. Fabric Capacity vertegenwoordigt compute-/servicecapaciteit en verbruik; de twee lossen verschillende architectuurvragen op.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d04","domain":"data","topic":"Delta Lake","level":"Basis","stem":"Waarom bevat een Delta-tabel naast Parquet-bestanden een map _delta_log?","options":["Voor het opslaan van Spark execution plans","Voor transactiemetadata en tabelversies","Voor het cachen van SQL-queryresultaten","Voor het bewaren van secrets en credentials"],"correct":[1],"explanation":"De Delta-transactielog legt wijzigingen in de samenstelling en metadata van de tabel vast en maakt consistente snapshots en ACID-transacties mogelijk. Parquet bewaart de kolomgeoriënteerde data.","source":"https://learn.microsoft.com/nl-nl/fabric/data-engineering/lakehouse-table-maintenance"},{"id":"d05","domain":"data","topic":"Medallion","level":"Gevorderd","stem":"Wat is de beste taakverdeling in een Bronze/Silver/Gold-architectuur?","options":["Bronze voor transformaties, Silver voor rapportage, Gold voor ruwe logs","Bronze brongetrouw, Silver opgeschoond, Gold bedrijfsgericht gemodelleerd","Bronze gemodelleerd, Silver raw, Gold technisch logging-only","Bronze geschoond, Silver onbeperkt raw, Gold uitsluitend realtime"],"correct":[1],"explanation":"Bronze bewaart de brondata zo getrouw mogelijk, Silver standaardiseert en valideert, en Gold levert consumptiegerichte modellen zoals dimensies en facts. De exacte lagen zijn ontwerpkeuzes, maar deze verantwoordelijkheidsverdeling helpt herverwerking en governance.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d06","domain":"data","topic":"Datatoegang","level":"Gevorderd","stem":"Een Delta-tabel staat in een ander Lakehouse. Je wilt die gebruiken zonder het bestand fysiek te dupliceren. Wat kies je?","options":["OneLake Shortcut","Copy Activity met full load","Dataflow Gen2 die alle rijen overneemt","INSERT INTO SELECT met een kopie"],"correct":[0],"explanation":"Een OneLake Shortcut maakt data op een andere locatie zichtbaar via een verwijzing. De originele bestanden blijven staan, en toegang tot de bron moet correct geautoriseerd zijn. Copy en INSERT verplaatsen of dupliceren data.","source":"https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts"},{"id":"d07","domain":"data","topic":"Datatoegang","level":"Gevorderd","stem":"Een ondersteunde operationele database moet met minimale maatwerk-ETL vrijwel doorlopend beschikbaar zijn in Fabric. Welke functie onderzoek je het eerst?","options":["Mirroring","Periodieke Copy Activity met volledige extractie","Dagelijkse Dataflow Gen2 met vervanging","Een notebook dat ieder uur een snapshot maakt"],"correct":[0],"explanation":"Mirroring integreert ondersteunde bronnen met Fabric, vaak via incrementele replicatie van bronwijzigingen. Niet alle mirroringtypen werken hetzelfde: metadata mirroring kan ook met shortcuts werken zonder volledige fysieke datakopie.","source":"https://learn.microsoft.com/en-us/fabric/mirroring/overview"},{"id":"d08","domain":"data","topic":"Datatoegang","level":"Examenniveau","stem":"Je maakt een OneLake-shortcut naar een andere map. Wat gebeurt er normaal met de brondata wanneer je uitsluitend de shortcut verwijdert?","options":["De brondata wordt mee verwijderd bij verwijderen van de shortcut","De brondata blijft bestaan","De brondata wordt automatisch geversioneerd in Fabric","De shortcutdoelgegevens worden als CSV geëxporteerd"],"correct":[1],"explanation":"Een shortcut is een onafhankelijk verwijsobject naar een target; het verwijderen van de shortcut verwijdert het doel niet. Andersom kan het verplaatsen of verwijderen van de target de shortcut onbruikbaar maken.","source":"https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts"},{"id":"d09","domain":"data","topic":"Data-inname","level":"Basis","stem":"Je moet gegevens uit een bron verbinden, zonder code datatypes corrigeren en kolommen combineren met Power Query. Welke functie is het meest passend?","options":["Dataflow Gen2","Fabric Notebook met PySpark","Warehouse stored procedure met T-SQL","Eventhouse KQL-query"],"correct":[0],"explanation":"Dataflow Gen2 biedt low-code databewerking met Power Query en kan resultaten naar ondersteunde doelen schrijven. Voor complex programmeerbare distributieverwerking gebruik je eerder notebooks/Spark.","source":"https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-overview"},{"id":"d11","domain":"data","topic":"Incremental laden","level":"Basis","stem":"Een tabel bevat 20 miljoen records, waarvan dagelijks 5.000 worden gewijzigd. Je wilt zoveel mogelijk onnodig opnieuw lezen vermijden. Welk patroon is logisch?","options":["Full load met dagelijkse truncate/reload","Incremental load op bronwijzigingen","Snapshotcompare van alle 20 miljoen records als enige optie","Alleen semantic model incremental refresh"],"correct":[1],"explanation":"Een incremental load beperkt de verwerking tot nieuwe en gewijzigde records, vaak op basis van CDC of een betrouwbare wijzigingskolom. Dat vermindert I/O en verwerking, mits deletes en late updates ook zijn afgedekt.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d12","domain":"data","topic":"Incremental laden","level":"Examenniveau","stem":"Je gebruikt ModifiedAt als watermark. Een run verwerkt wijzigingen tot 08:00, maar faalt tijdens het laden. Wat moet met de persistente watermark gebeuren?","options":["Voor iedere run verhogen vóór de eerste extractie","Pas na succesvolle commit en validatie naar 08:00 verhogen","Na falen naar de starttijd van diezelfde run verhogen","Bij iedere retry opnieuw de actuele tijd als beginpunt instellen"],"correct":[1],"explanation":"Een opgeslagen watermark mag pas vooruit wanneer alle wijzigingen tot die grens succesvol zijn geladen en gevalideerd. Anders sla je gegevens over na herstart. Maak heruitvoering veilig met idempotente verwerking en een vooraf vastgelegde upper bound.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d13","domain":"data","topic":"Incremental laden","level":"Examenniveau","stem":"Een bronsysteem verwijdert klanten definitief. Je incremental extract gebruikt alleen ModifiedAt > LastWatermark op nog bestaande rijen. Welke beperking heeft dit?","options":["Deletes kunnen onopgemerkt blijven","Soft deletes worden altijd opgepikt","Alle gewijzigde natuurlijke sleutels worden herkend","CDC-events worden automatisch toegepast"],"correct":[0],"explanation":"Een filter op overgebleven records toont niet automatisch welke records zijn verwijderd. Je hebt voor betrouwbare deleteverwerking bijvoorbeeld CDC, tombstones, change tracking of periodieke snapshotvergelijking nodig.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d14","domain":"data","topic":"Incremental laden","level":"Gevorderd","stem":"Een SQL-lading moet bestaande klanten aanpassen en onbekende klanten toevoegen op basis van een unieke business key. Welk T-SQL-patroon past het best?","options":["MERGE met MATCHED en NOT MATCHED BY TARGET","INSERT INTO SELECT van alle bronrecords","UPDATE zonder INSERT-pad","SELECT DISTINCT naar een tijdelijke view"],"correct":[0],"explanation":"MERGE kan een doel vergelijken met een bron en per match een update of insert uitvoeren. Zorg voor één bronrecord per matching key en een transactioneel betrouwbaar ontwerp; duplicaten in de bron kunnen fouten of ongewenste resultaten geven.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d15","domain":"data","topic":"Dimensional modeling","level":"Gevorderd","stem":"Een klant verhuist. De omzetanalyse moet historische omzet blijven groeperen op het adres dat geldig was op transactiedatum. Welk dimensiepatroon kies je?","options":["SCD Type 0","SCD Type 1","SCD Type 2","Een periodic snapshot fact als vervanger van alle dimensieversies"],"correct":[2],"explanation":"SCD Type 2 maakt een nieuwe dimensieversie met nieuwe surrogate key en geldigheidsperiode. Historische facts blijven naar de oude versie verwijzen zodat rapporten de toenmalige context behouden.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d16","domain":"data","topic":"Dimensional modeling","level":"Basis","stem":"Bij welk SCD-type overschrijf je de oude dimensiewaarde zonder historie in de dimensie te bewaren?","options":["Type 0","Type 1","Type 2","Type 3"],"correct":[1],"explanation":"SCD Type 1 vervangt de bestaande waarde. Type 0 verandert de waarde niet, terwijl Type 2 een nieuwe rij aanmaakt en historie bewaart. Kies Type 1 als alleen de meest recente correcte waarde nodig is.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d17","domain":"data","topic":"Dimensional modeling","level":"Gevorderd","stem":"Een facttabel heeft één rij per verhuurcontractregel. Wat is de betekenis van die ontwerpbeslissing?","options":["Dit definieert de grain van de fact","Dit definieert de natuurlijke sleutel van de dimensie","Dit definieert het SCD-type voor alle dimensies","Dit bepaalt de automatische IDENTITY-startwaarde"],"correct":[0],"explanation":"De grain beschrijft precies wat één factrij vertegenwoordigt. Alle measures en dimensiesleutels moeten op die grain aansluiten, anders ontstaat dubbeltelling bij joins en aggregaties.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d18","domain":"data","topic":"Dimensional modeling","level":"Gevorderd","stem":"Een dimensie met meerdere versies van dezelfde klant heeft een unieke technische sleutel nodig per versie. Welke sleutel gebruik je in facts?","options":["Een surrogate key van de dimensieversie","De natuurlijke sleutel van de klant","Een hash van de klantnaam zonder versienummer","De transactiedatum als unieke klantidentificatie"],"correct":[0],"explanation":"Facts verwijzen naar de surrogate key van de juiste dimensieversie. De natural/business key identificeert de klant over tijd, terwijl de surrogate key de specifieke versie van de klant uniek maakt.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/identity"},{"id":"d19","domain":"data","topic":"Dimensional modeling","level":"Examenniveau","stem":"Wat is in Fabric Warehouse een ondersteunde manier om automatisch technische sleutels te genereren?","options":["INT IDENTITY(1,1) met eigen increment","BIGINT IDENTITY zonder eigen seed/increment","BIGINT IDENTITY(1,1) met expliciete seed","UNIQUEIDENTIFIER IDENTITY"],"correct":[1],"explanation":"Fabric Warehouse ondersteunt BIGINT IDENTITY voor automatisch gegenereerde unieke waarden. De start en increment kun je niet zelf opgeven en de getallen hoeven niet aaneengesloten of in laadvolgorde oplopend te zijn.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/identity"},{"id":"d20","domain":"data","topic":"Dimensional modeling","level":"Examenniveau","stem":"Je definieert een PRIMARY KEY en FOREIGN KEY in Fabric Warehouse met NOT ENFORCED. Welke uitspraak is juist?","options":["De engine valideert automatisch nieuwe relaties","Je moet uniciteit en referentiële integriteit zelf bewaken","De engine herstelt vanzelf ontbrekende dimension keys","De engine maakt automatisch indexes die de FK afdwingen"],"correct":[1],"explanation":"NOT ENFORCED betekent dat de database de sleutelrelaties niet zoals een traditionele relationele database afdwingt. Je moet duplicaten, ontbrekende dimensiesleutels en referentiële integriteit expliciet controleren in je data-engineeringproces.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d21","domain":"data","topic":"Dimensional modeling","level":"Examenniveau","stem":"Een factrecord komt binnen voordat de bijbehorende dimensie bekend is. Welk robuust patroon past daarbij?","options":["De fact direct aan de actuele dimensieversie koppelen, ook bij andere keys","Een unknown/inferred dimensielid gebruiken en later aanvullen","Alleen de fact bewaren als een normale dimensie","De fact blokkeren totdat alle historische snapshots opnieuw geladen zijn"],"correct":[1],"explanation":"Bij laat arriverende dimensies kun je met een unknown of inferred member werken en later de ontbrekende context aanvullen. Daarmee voorkom je dat facts verdwijnen of aan een onjuiste business-entiteit gekoppeld worden.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d22","domain":"data","topic":"PySpark en SQL","level":"Gevorderd","stem":"Welke PySpark-transformatie verwijdert records waarvoor OrderID NULL is?","options":["df.filter(F.col(\"OrderID\").isNotNull())","df.groupBy(\"OrderID\")","df.withColumnRenamed(\"OrderID\", \"ID\")","df.cache()"],"correct":[0],"explanation":"filter met isNotNull() behoudt uitsluitend rijen met een waarde in OrderID. groupBy groepeert, withColumnRenamed hernoemt en cache bewaart een dataset voor hergebruik zonder rijen te verwijderen.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700","code":"from pyspark.sql import functions as F\n\n# df bevat onder andere een kolom OrderID"},{"id":"d23","domain":"data","topic":"PySpark en SQL","level":"Examenniveau","stem":"Een bron bevat meerdere versies per OrderID. Je wilt de nieuwste wijziging op ModifiedAt behouden, met een extra stabiele tie-breaker. Welke aanpak past het best?","options":["dropDuplicates([\"OrderID\"]) zonder sorteervolgorde","row_number() over partitionBy OrderID orderBy ModifiedAt desc plus tie-breaker","groupBy OrderID met willekeurige first()","ORDER BY ModifiedAt op het volledige DataFrame en vervolgens dropDuplicates"],"correct":[1],"explanation":"Een window met row_number en een expliciete sortering kiest reproduceerbaar de bedoelde nieuwste versie. Alleen dropDuplicates op OrderID garandeert niet welke record wordt behouden wanneer er meerdere kandidaten zijn.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d24","domain":"data","topic":"PySpark en SQL","level":"Gevorderd","stem":"Een Spark DataFrame krijgt achtereenvolgens filter() en select(). Wat is in het algemeen waar over de uitvoering?","options":["Spark voert elke transformatie meteen op de cluster uit","Spark bouwt meestal eerst een logisch plan; een actie start de uitvoering","filter() veroorzaakt altijd dezelfde shuffle als groupBy()","select() overschrijft direct de onderliggende Delta-tabel"],"correct":[1],"explanation":"Spark DataFrame-transformaties zijn doorgaans lazy. Spark kan bewerkingen optimaliseren voordat een actie zoals count(), collect() of write de uitvoering triggert. Een filter of select wijzigt de bronbestanden op zichzelf niet.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700","code":"df2 = df.filter(F.col(\"Quantity\") > 0).select(\"OrderID\")\n# Er is nog geen count(), collect() of write() uitgevoerd."},{"id":"d25","domain":"data","topic":"PySpark en SQL","level":"Gevorderd","stem":"Een factjoin geeft ineens twee keer zoveel rijen terug als verwacht. Wat onderzoek je als eerste?","options":["Of de join-key in de dimensie uniek is voor de bedoelde grain","Of de lookup op een SCD Type 1-rij is gebaseerd","Of de facttabel een clustered index heeft","Of het Warehouse voldoende queryresultaatcache heeft"],"correct":[0],"explanation":"Een één-op-veelmatch door dubbele sleutels of verkeerde dimensieversies kan het aantal factrijen vermenigvuldigen. Controleer de join-conditie en verwachte kardinaliteit voordat je geaggregeerde omzet vertrouwt.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d26","domain":"data","topic":"Data quality","level":"Gevorderd","stem":"Je wilt in Silver minimaal betrouwbare klantdata overhouden. Welke acties zijn gebruikelijk? Selecteer alle juiste antwoorden.","options":["Datatypen standaardiseren","Business-keyduplicaten volgens expliciete regels behandelen","Ontbrekende kritieke sleutels controleren","Alle brondata zonder logging definitief wissen"],"correct":[0,1,2],"explanation":"Silver is de gecontroleerde, opgeschoonde laag. Valideer sleutels, types en deduplicatieregels terwijl je voldoende broninformatie bewaart om problemen te analyseren en data opnieuw te verwerken.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d27","domain":"data","topic":"Streaming","level":"Basis","stem":"Je ontvangt doorlopend IoT-events en wilt deze filteren, routeren en met KQL analyseren. Welke combinatie past het best?","options":["Eventstream + Eventhouse","Spark Structured Streaming + Delta Lakehouse","Scheduled Data Pipeline + Warehouse","Dataflow Gen2 + Lakehouse"],"correct":[0],"explanation":"Eventstream helpt streamingevents opnemen, bewerken en routeren. Eventhouse is bedoeld voor snelle event- en tijdreeksanalyse met KQL. De overige combinaties behandelen ALM, security of batchmodellering.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d28","domain":"data","topic":"Streaming","level":"Gevorderd","stem":"Welke KQL-bewerking berekent het aantal events per DeviceID over een vast vijfminuteninterval?","options":["| count by DeviceID, Timestamp","| summarize Aantal=count() by DeviceID, bin(Timestamp, 5m)","| project DeviceID, bin(Timestamp, 5m)","| extend Aantal=count() by DeviceID"],"correct":[1],"explanation":"summarize maakt de aggregatie, count telt rijen en bin(Timestamp, 5m) groepeert tijden in vaste intervallen. where filtert, project selecteert kolommen en extend voegt berekende velden toe.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700","code":"Telemetry\n| where Timestamp > ago(1h)\n// Voeg hier de juiste KQL-aggregatie toe"},{"id":"d29","domain":"data","topic":"Streaming","level":"Gevorderd","stem":"Je wilt vensters van tien minuten berekenen die iedere twee minuten opnieuw beginnen. Welk type window is dat?","options":["Tumbling window van tien minuten","Hopping window met size 10 minuten en hop 2 minuten","Session window met inactiviteitsgrens van twee minuten","Tumbling window van twee minuten"],"correct":[1],"explanation":"Bij een hopping window is de hop kleiner dan de venstergrootte, waardoor tijdvensters elkaar overlappen. Een tumbling window bestaat uit niet-overlappende vaste tijdsblokken.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d30","domain":"data","topic":"Streaming","level":"Gevorderd","stem":"In Spark Structured Streaming wil je na een crash kunnen hervatten met vastgelegde verwerkingsvoortgang. Welke voorziening is daarvoor essentieel?","options":["Checkpointlocatie","Watermark alleen","Streaming outputMode alleen","Een tijdelijke DataFrame-cache"],"correct":[0],"explanation":"Een streaming checkpoint bewaart onder andere voortgang en eventueel state om na een herstart door te gaan. Een watermark stuurt vooral het omgaan met late eventdata en statebeheer en vervangt de checkpoint niet.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"d31","domain":"data","topic":"Streaming","level":"Examenniveau","stem":"Een Spark Structured Streaming-aggregatie gebruikt withWatermark(\"EventTime\", \"10 minutes\"). Wat is de hoofdfunctie?","options":["De verwerking exact elke tien minuten activeren","De toegestane vertraging voor event-time stateful verwerking begrenzen","Alle events ouder dan tien minuten onmiddellijk altijd verwijderen uit bronopslag","Een checkpoint vervangen door een tijdsgrens"],"correct":[1],"explanation":"De watermark helpt de engine bepalen welke late events nog kunnen meetellen en wanneer oude state kan worden opgeruimd. Het is geen schedulingtrigger en garandeert niet zelfstandig exactly-once bij alle bronnen en sinks.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700","code":"result = (events\n  .withWatermark(\"EventTime\", \"10 minutes\")\n  .groupBy(F.window(\"EventTime\", \"5 minutes\"))\n  .count())"},{"id":"m01","domain":"monitor","topic":"Monitoring","level":"Basis","stem":"Je wilt snel zien welke notebooks, pipelines en andere ondersteunde Fabric-activiteiten zijn uitgevoerd en of ze zijn mislukt. Waar begin je?","options":["Monitoring Hub","Fabric Capacity Metrics app","Query Insights voor Warehouse","Semantic model refresh history"],"correct":[0],"explanation":"Monitoring Hub biedt een centraal vertrekpunt voor uitvoeringsstatus en details van ondersteunde Fabric-activiteiten. Voor diepgaande diagnose ga je vervolgens naar de specifieke run-, log- of engineweergave.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/troubleshoot-spark"},{"id":"m02","domain":"monitor","topic":"Monitoring","level":"Basis","stem":"Welke toepassing helpt onderzoeken of een Fabric Capacity zwaar wordt belast of wordt afgeremd?","options":["Capacity Metrics app","Spark UI per notebook","Query Insights per Warehouse","Dataflow refresh history"],"correct":[0],"explanation":"De Capacity Metrics app helpt capaciteitsverbruik en knelpunten onderzoeken op capacityniveau. Voor de precieze oorzaak kijk je daarnaast naar query-, pipeline- of Spark-details.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m03","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Je wilt van een Warehouse weten welke T-SQL-querys historisch lang duren. Welke voorziening past?","options":["Query Insights","Monitoring Hub voor algemene uitvoeringen","Capacity Metrics voor capacityverbruik","Spark UI voor stages en executors"],"correct":[0],"explanation":"Query Insights verzamelt historisch querygedrag en biedt onder meer overzichten van langlopende en veel uitgevoerde SQL-querys. Hiermee kun je aantonen welke SQL-patronen structureel vertragen.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"},{"id":"m04","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Welke Query Insights-view helpt lange SQL-queries in een Fabric Warehouse te vinden?","options":["queryinsights.long_running_queries","queryinsights.frequently_run_queries","queryinsights.sql_pool_insights","queryinsights.exec_sessions_history"],"correct":[0],"explanation":"queryinsights.long_running_queries bevat informatie over langlopende querys. Daarnaast zijn onder meer exec_requests_history en frequently_run_queries beschikbaar voor gedetailleerde analyse.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"},{"id":"m05","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Een pipeline faalt bij een Copy Activity. Je wilt de exacte foutmelding en mislukte activiteit zien. Waar kijk je het eerst?","options":["De activity-run details in de uitvoeringsgeschiedenis","Alleen de algemene status in Monitoring Hub","Capacity Metrics voor het gehele capacitygebruik","Query Insights van een Warehouse zonder gerelateerde SQL"],"correct":[0],"explanation":"De uitvoeringsgeschiedenis met activity details geeft status, invoer/uitvoer en foutinformatie van de mislukte stap. Dit is gerichter dan meteen breed resources opschalen of willekeurige iteminstellingen aanpassen.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m06","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Een Dataflow Gen2-refresh faalt bij de bronverbinding. Waar onderzoek je dit?","options":["Refresh history en connection-/credentialdetails","Capacity Metrics zonder foutdetails","Query Insights van een los Warehouse","Spark UI van een niet-gerelateerd notebook"],"correct":[0],"explanation":"De refresh history toont de fout bij de dataflowuitvoering. Controleer daarna de credentials, bronbereikbaarheid, eventuele gateway en datatypen, afhankelijk van de foutmelding.","source":"https://learn.microsoft.com/en-us/fabric/data-factory/dataflows-gen2-overview"},{"id":"m07","domain":"monitor","topic":"Monitoring","level":"Basis","stem":"Een Power BI semantic model wordt niet vernieuwd. Welke eerste informatiebron is gericht op deze fout?","options":["Semantic model refresh history","Warehouse Query Insights","Spark UI van notebooks","Eventstream ingestiemetrics"],"correct":[0],"explanation":"De refresh history geeft informatie over timing, foutmelding en foutfase van het semantic model. Het probleem kan liggen bij broncredentials, capaciteit, gateway of querys; begin met de specifieke refreshdetails.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m08","domain":"monitor","topic":"Monitoring","level":"Examenniveau","stem":"Een Fabric Notebook draait traag; in één stage duurt één task twintig keer langer dan de rest. Wat is de meest waarschijnlijke technische oorzaak?","options":["Data skew","Een te kleine queryresultaatcache","Een te kleine SQL warehouse pool","Een verlopen gatewaycredential"],"correct":[0],"explanation":"Data skew betekent dat een of enkele partitions veel meer werk doen dan andere. In de Spark UI kun je taskduur, shuffle I/O en partitionverschillen vergelijken; mogelijke oplossingen zijn repartitionering, salting of aangepaste joins.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m09","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Een notebook toont executor OutOfMemory tijdens een grote join. Welke diagnose is het meest gericht?","options":["Spark UI: executors, stages, memory en shuffle onderzoeken","Alleen Warehouse Query Insights raadplegen","Alleen de row-level-security-policy inspecteren","De pipeline opnieuw uitvoeren zonder logging"],"correct":[0],"explanation":"OutOfMemory bij een join kan onder andere komen door skew, een te grote partition, caching of ongunstige joinstrategie. Spark UI en executorlogs tonen waar geheugen en shuffleverbruik oplopen.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/troubleshoot-spark"},{"id":"m10","domain":"monitor","topic":"Spark optimalisatie","level":"Gevorderd","stem":"Je joint 200 miljoen feiten aan een dimensie van slechts enkele duizenden rijen. Welke strategie kan een grote shuffle vermijden?","options":["Broadcast join van de kleine dimensie","Sort-merge join met shuffle van beide tabellen","Repartition beide tabellen op meer partitions","Cache uitsluitend de grote fact vóór de join"],"correct":[0],"explanation":"Bij een broadcast join verspreidt Spark de kleine tabel over executors, zodat voor die join veel data-uitwisseling kan worden vermeden. De kleine tabel moet voldoende klein zijn om veilig te broadcasten.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m11","domain":"monitor","topic":"Spark optimalisatie","level":"Gevorderd","stem":"Welke Spark-functie kan runtime-informatie benutten om joinstrategieën of shufflepartities tijdens uitvoering bij te stellen?","options":["Adaptive Query Execution (AQE)","Adaptive capacity throttling","Statische join hints in de SQL-code","Executor dynamic allocation als queryplanner"],"correct":[0],"explanation":"AQE gebruikt uitvoeringstatistieken om onder andere post-shuffle-partities samen te voegen, skew te beperken en bepaalde joins te optimaliseren. Dit is een uitvoeringsoptimalisatie, geen data governance-functie.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m12","domain":"monitor","topic":"Spark optimalisatie","level":"Examenniveau","stem":"Een Spark-job loopt traag door extreem veel kleine partitions en schedulingoverhead. Wat is een logische eerste stap?","options":["Partitionering en taakverdeling analyseren en passend samenvoegen","Het aantal shufflepartitions onbegrensd verhogen","Alle partities op één executor concentreren","Caching inschakelen zonder de partitionering te controleren"],"correct":[0],"explanation":"Te veel kleine partitions veroorzaken overhead; te weinig grote partitions verminderen parallelisme. Kijk in de Spark UI naar partitiongrootte, taakduur en shuffle, en pas vervolgens bijvoorbeeld coalesce of repartition doelgericht toe.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m13","domain":"monitor","topic":"Spark optimalisatie","level":"Gevorderd","stem":"Hetzelfde dure tussenresultaat wordt herhaaldelijk door verschillende acties in één notebook hergebruikt. Welke techniek kan nuttig zijn?","options":["cache() of persist() met beheerste lifecycle","repartition() bij iedere actie zonder caching","collect() van het volledige resultaat bij iedere actie","Een nieuwe Spark-sessie starten voor elke actie"],"correct":[0],"explanation":"Caching/persisting kan recomputatie voorkomen als dezelfde dataset vaak opnieuw wordt gebruikt en voldoende geheugen beschikbaar is. Onnodig cachen geeft juist geheugen- en evictiondruk; ruim cached data op als deze niet meer nodig is.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m14","domain":"monitor","topic":"Delta optimalisatie","level":"Basis","stem":"Een Lakehouse Delta-tabel bestaat uit tienduizenden kleine Parquet-bestanden. Welke onderhoudsactie is het meest gericht op compaction?","options":["OPTIMIZE","VACUUM","Z-Order op een filterkolom zonder compactiondoel","V-Order inschakelen zonder compaction"],"correct":[0],"explanation":"OPTIMIZE kan kleine bestanden samenvoegen tot grotere bestanden, wat overhead bij scans vermindert. VACUUM verwijdert niet meer gerefereerde historische bestanden en heeft een ander doel.","source":"https://learn.microsoft.com/nl-nl/fabric/data-engineering/lakehouse-table-maintenance"},{"id":"m15","domain":"monitor","topic":"Delta optimalisatie","level":"Basis","stem":"Je wilt oude, niet meer gerefereerde Delta-bestanden opruimen volgens een retentiebeleid. Welke actie past?","options":["OPTIMIZE met compaction","VACUUM","Z-Order op een datumkolom","V-Order op Parquet"],"correct":[1],"explanation":"VACUUM verwijdert bestanden die niet langer door de actieve Delta-versie worden gebruikt en oud genoeg zijn volgens het retentiebeleid. Hiermee verklein je opslagverbruik, maar oudere Time Travel-versies kunnen daardoor onbruikbaar worden.","source":"https://learn.microsoft.com/nl-nl/fabric/data-engineering/lakehouse-table-maintenance"},{"id":"m16","domain":"monitor","topic":"Delta optimalisatie","level":"Examenniveau","stem":"Een team wil tijdreizen naar een Delta-versie van drie weken geleden. Kort geleden is VACUUM uitgevoerd met korte retentie. Wat is het voornaamste risico?","options":["De bestanden voor de oude versie kunnen al verwijderd zijn","Het Delta-log heeft per definitie alle benodigde Parquet-data behouden","Een checkpoint zou automatisch oude snapshots herstellen","Query Insights kan de verwijderde versie opnieuw genereren"],"correct":[0],"explanation":"Time Travel is afhankelijk van de oude transactiemetadata én van nog beschikbare databestanden. VACUUM kan verouderde bestanden verwijderen, waardoor een oudere versie niet meer leesbaar is. Stem retentie op herstel- en historie-eisen af.","source":"https://learn.microsoft.com/nl-nl/fabric/data-engineering/lakehouse-table-maintenance"},{"id":"m17","domain":"monitor","topic":"Delta optimalisatie","level":"Gevorderd","stem":"Een Delta-workload leest veelvuldig dezelfde grote datasets voor interactieve rapporten. Welke bestandsoptimalisatie kan leesefficiëntie verbeteren, mogelijk ten koste van schrijftijd?","options":["V-Order","Z-Order op één filterkolom","Aanpassing van de warehouse-statistieken","Delta VACUUM na iedere leestoegang"],"correct":[0],"explanation":"V-Order optimaliseert de Parquet-bestandslayout voor leesworkloads. Schrijven kan hierdoor langer duren; het is daarom een afweging en niet voor iedere ingestie- of schrijfintensieve workload de beste standaard.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order"},{"id":"m18","domain":"monitor","topic":"Delta optimalisatie","level":"Examenniveau","stem":"Welke stelling over de standaard V-Order-instelling voor nieuwe Fabric-workspaces klopt?","options":["V-Order is uitgeschakeld bij nieuwe workspaces","V-Order is voor alle nieuwe workspaces verplicht ingeschakeld","V-Order staat alleen aan bij Eventhouse shortcuts","V-Order is uitsluitend een instelling van semantic models"],"correct":[0],"explanation":"Microsoft heeft V-Order voor nieuw gemaakte workspaces standaard uitgeschakeld om schrijfintensieve workloads te ontzien. Je kunt het gericht gebruiken waar de verwachte leeswinst de extra schrijftijd rechtvaardigt.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/delta-optimization-and-v-order"},{"id":"m19","domain":"monitor","topic":"Delta optimalisatie","level":"Gevorderd","stem":"Een enorme Delta-tabel wordt meestal op een beperkte datumrange gefilterd. Welke aanpak kan onnodig lezen helpen beperken?","options":["Een geschikt partitie- of clusteringontwerp met data skipping","Elke dag alle partities samenvoegen tot één file","Alle data naar het geheugen van de driver verplaatsen","De tabel uitsluitend met een nieuw SQL-schema hernoemen"],"correct":[0],"explanation":"Een geschikte fysieke data-indeling helpt engines bestanden of partitions over te slaan. Kies partitionering met oog voor kardinaliteit en bestandsgrootte; te veel kleine partities veroorzaken juist overhead.","source":"https://learn.microsoft.com/nl-nl/fabric/data-engineering/lakehouse-table-maintenance"},{"id":"m20","domain":"monitor","topic":"Delta optimalisatie","level":"Examenniveau","stem":"Een team wil een moderne, flexibele clusteringaanpak voor nieuwe grote Delta-tabellen binnen een compatibele Fabric Runtime gebruiken. Welke optie verdient onderzoek?","options":["Liquid clustering","Z-Order-optimalisatie met vaste kolomkeuze","Statische partitionering op de hoogste kardinaliteit","V-Order als vervanging van clustering"],"correct":[0],"explanation":"Liquid clustering kan data flexibel organiseren voor betere pruning zonder een statisch partitieontwerp. Vergelijk dit met klassieke partitionering en Z-Order op basis van runtime, workload, compatibiliteit en het actuele featureaanbod.","source":"https://learn.microsoft.com/en-us/fabric/data-engineering/runtime-2-0"},{"id":"m21","domain":"monitor","topic":"Warehouse optimalisatie","level":"Gevorderd","stem":"Een Warehouse-query leest zeer veel onnodige kolommen en records. Wat is een eenvoudige, vaak effectieve optimalisatie?","options":["Alleen benodigde kolommen selecteren en filters vroeg toepassen","Alleen de capacity vergroten zonder queryaanpassing","Dezelfde SQL-query opnieuw in een notebook uitvoeren","Uitsluitend de eindrapportagecaching verhogen"],"correct":[0],"explanation":"Kolomselectie en predicate-filtering beperken te lezen en te verplaatsen data. Onderzoek daarnaast het uitvoeringsplan, statistieken en join-kardinaliteiten als de query nog steeds traag is.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"},{"id":"m22","domain":"monitor","topic":"Warehouse optimalisatie","level":"Gevorderd","stem":"Een Warehouse-query kiest een inefficiënte joinstrategie door slechte informatie over datawaarden. Wat kan hierbij helpen?","options":["Relevante statistieken controleren en bijwerken","Alleen queryresultaatcaching verhogen","Meer administrators aan de workspace toevoegen","Ongeacht queryvorm SELECT * gebruiken"],"correct":[0],"explanation":"Gegevensdistributiestatistieken helpen de SQL-optimizer een passend plan kiezen. Fabric ondersteunt automatische statistieken en mogelijkheden om ze waar nodig doelgericht te beheren.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"},{"id":"m25","domain":"monitor","topic":"Pipeline optimalisatie","level":"Examenniveau","stem":"Een pipeline voert duizenden onafhankelijk uitvoerbare kleine copytaken achter elkaar uit. Wat onderzoek je om de totale doorlooptijd te verkorten?","options":["Veilige paralleliteit en batching met rekening voor bronlimieten","Alleen het aantal pipeline-variabelen verhogen","Alle activiteiten verplicht een nieuwe Spark-sessie geven","Alle onafhankelijke activiteiten achter één seriële afhankelijkheid zetten"],"correct":[0],"explanation":"Afhankelijkheden kunnen voorkomen dat onafhankelijke taken gelijktijdig worden verwerkt. Gecontroleerde paralleliteit en batching kunnen helpen, zolang bronlimieten, capaciteit en foutafhandeling worden meegenomen.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m27","domain":"monitor","topic":"Streaming diagnose","level":"Gevorderd","stem":"Een Eventstream ontvangt aantoonbaar events, maar het Eventhouse toont geen nieuwe rijen. Wat controleer je eerst?","options":["Bestemming, ingestiemapping, schema en foutdetails","De query acceleration-cache van een andere shortcut verversen","De Spark executor dynamic allocation verhogen","Alle Warehouse-statistieken herbouwen"],"correct":[0],"explanation":"Als ontvangst wel plaatsvindt maar de bestemming leeg blijft, ligt het voor de hand de routering, bestemming, schema- en ingestiemapping en eventuele ingestiefouten te onderzoeken. Je moet het probleem lokaliseren voordat je de capacity vergroot.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m28","domain":"monitor","topic":"Streaming diagnose","level":"Gevorderd","stem":"Een streamprocessor stapelt steeds meer onverwerkte events op. Welke combinatie van metrieken is het nuttigst?","options":["Ingestieratio, verwerkingsratio en backlog/latency","Alleen de totale opslaggrootte in OneLake","Alleen de gemiddelde SQL-queryduur","Alleen het aantal gelijktijdige notebookgebruikers"],"correct":[0],"explanation":"Wanneer meer events binnenkomen dan de verwerking aankan, groeit de achterstand. Door intake, throughput en end-to-end latency te vergelijken kun je bepalen of de bottleneck bij bron, processing of bestemming ligt.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m29","domain":"monitor","topic":"Eventhouse optimalisatie","level":"Examenniveau","stem":"Je wilt vaak KQL-querys draaien over een bestaande OneLake-shortcut naar Delta-data. Welke optie kan herhaald lezen versnellen zonder een gewone fysieke ETL-copy te bouwen?","options":["Query acceleration op de shortcut","Alleen V-Order op een willekeurige Lakehouse-tabel","Alleen Query Insights op het Warehouse","De complete brondata iedere minuut opnieuw kopiëren"],"correct":[0],"explanation":"Eventhouse Query Acceleration kan voor shortcuts data binnen een configureerbaar cachingvenster beschikbaar houden voor snellere queries. De ingestie-/cachekosten en de geschiktheid van de workload horen bij de afweging.","source":"https://learn.microsoft.com/fabric/real-time-intelligence/query-acceleration"},{"id":"m30","domain":"monitor","topic":"Monitoring","level":"Gevorderd","stem":"Je wilt gebruikers een waarschuwing geven bij een relevante operationele gebeurtenis in Fabric. Welk ontwerp hoort bij de monitoringsverantwoordelijkheid?","options":["Een alertregel op een ondersteunde conditie met geschikte actie of notificatie","Een periodieke handmatige query in Query Insights","Een SQL-view zonder evaluatie of notificatie","Een deployment pipeline zonder monitoringsconditie"],"correct":[0],"explanation":"Alerts verbinden een controleerbare conditie aan een actie, bijvoorbeeld een notificatie of vervolgworkflow. Stel een betekenisvolle drempel in en voorkom alertmoeheid; de concrete mogelijkheden hangen af van de gebruikte Fabric-items.","source":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-700"},{"id":"m32","domain":"monitor","topic":"Performance redeneren","level":"Gevorderd","stem":"Je optimaliseert een Fabric Warehouse-factload. Welke maatregelen zijn zinvol? Selecteer alle juiste antwoorden.","options":["Set-based INSERT/SELECT of MERGE gebruiken","Join-sleutels en bronduplicaten vooraf controleren","Incremental loads en betekenisvolle validaties inzetten","Voor miljoenen rijen losse INSERT-statements vanuit een client sturen"],"correct":[0,1,2],"explanation":"Set-based T-SQL, goede datahygiëne en gecontroleerde incrementele patronen verbeteren doorgaans efficiëntie en betrouwbaarheid. Miljoenen losse statements vergroten round-trip-overhead en maken herstel lastig.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"},{"id":"m33","domain":"monitor","topic":"Spark optimalisatie","level":"Examenniveau","stem":"Een notebook gebruikt collect() op een dataset met honderden miljoenen rijen en de driver crasht. Wat verklaart dit?","options":["collect() probeert alle geretourneerde data op de driver samen te brengen","collect() materialiseert data uitsluitend op executors","collect() is lazy en veroorzaakt dus geen uitvoering","collect() streamt zonder geheugenverbruik één rij per keer"],"correct":[0],"explanation":"collect() materialiseert alle rijen van het DataFrame bij de driver en kan daardoor diens geheugen uitputten. Beperk data met filter/limit, voer distributieverwerking op executors uit en haal alleen kleine resultaten naar de driver.","source":"https://learn.microsoft.com/fabric/data-engineering/spark-monitoring-best-practices"},{"id":"m34","domain":"monitor","topic":"Performance redeneren","level":"Gevorderd","stem":"Je wilt nagaan of een querylangzaamheidsprobleem vooral samenhangt met veel remote scans in plaats van cachehits. Welke analyse helpt?","options":["Query Insights: remote versus memory/disk scanned data vergelijken","Alleen de storagegrootte in OneLake bekijken","De inhoud van de SCD Type 2-dimensie vergelijken","Een Spark executor memory-metric gebruiken voor SQL remote scans"],"correct":[0],"explanation":"Query Insights kan statistieken tonen over hoeveel data vanuit remote storage versus geheugen of schijf werd gelezen. Dat helpt begrijpen of opslag-I/O en caching bijdragen aan vertraging.","source":"https://learn.microsoft.com/en-us/fabric/data-warehouse/query-insights"}];

      save();
    }
    function feedback(q,selection){let good=isCorrect(q,selection),correct=q.correct.map(idx=>`<div>✓ ${safe(q.options[idx])}</div>`).join('');return `<div class="feedback ${good?'success':'failure'}" role="status"><h3>${good?'✓ Goed beantwoord':'✕ Nog niet goed'}</h3><div class="muted" style="font-size:12px;font-weight:800;margin-top:12px">${tr('JUISTE ANTWOORD','CORRECT ANSWER')}${q.correct.length>1?tr('EN','S'):''}</div><div class="answer-list">${correct}</div><div class="muted" style="font-size:12px;font-weight:800;margin-top:16px">${tr('WAAROM?','WHY?')}</div><p>${safe(q.explanation)}</p><div class="source">${sourceLink(q)}</div></div>`}
    function toggleChoice(idx){let s=state.session,q=BANK[s.ids[s.index]],id=q.id;if(answered(s,id))return;let v=s.draft[id]||[];s.draft[id]=q.correct.length>1?(v.includes(idx)?v.filter(x=>x!==idx):[...v,idx]):[idx];save();drawQuiz();}
    function submitAnswer(){let s=state.session,id=s.ids[s.index],v=s.draft[id]||[];if(!v.length)return;let q=BANK[id];s.answers[id]=v.slice();logAnswer(s,id);save();if(s.mode==='exam')advance();else drawQuiz();}
    function advance(){let s=state.session;s.index++;if(s.index>=s.ids.length)finish(false);else{save();drawQuiz();scrollTop()}}
    function finish(timedOut){let s=state.session;if(!s||s.finished)return;s.finished=true;s.screen='results';s.timedOut=!!timedOut;s.completed=Date.now();for(let id of s.ids){if(answered(s,id))logAnswer(s,id)}state.history.unshift({at:s.completed,mode:s.mode,score:sessionScore(s),total:s.ids.length,timedOut:!!timedOut});save();trackActivity('Resultaten bekijken');results();scrollTop()}
    function results(){let s=state.session;if(!s)return home();if(clock)clearInterval(clock);s.screen='results';const good=sessionScore(s),pct=Math.round(good/s.ids.length*100),wrong=s.ids.filter(id=>!answered(s,id)||!isCorrect(BANK[id],s.answers[id]));let descriptor=pct>=85?'Sterk resultaat':pct>=70?'Goede basis, maar blijf oefenen':'Gerichte herhaling helpt';let domainRows=s.mode==='imported'?[{key:'imported',label:s.importedTitle||tr('Geïmporteerde toets','Imported exam'),n:s.ids.length,ok:good,pct}]:Object.entries(DOMAINS).map(([key,label])=>{let ids=s.ids.filter(id=>BANK[id].domain===key),ok=ids.filter(id=>answered(s,id)&&isCorrect(BANK[id],s.answers[id])).length;return {key,label,n:ids.length,ok,pct:ids.length?Math.round(ok/ids.length*100):0}}).filter(d=>d.n);
      document.title=state.lang==='en'?`${pct}% — ${state.examId?.toUpperCase()||'Exam'} result`:`${pct}% — ${state.examId?.toUpperCase()||'Toets'} resultaat`;
      $('main').innerHTML=`<div class="quiz-layout"><div class="quiz-top"><button id="backhome" type="button" class="text-btn">← ${tr('Naar startpagina','Home')}</button><span class="pill">${s.mode==='imported'?safe(s.importedTitle||tr('Geïmporteerde toets','Imported exam')):s.mode==='exam'?tr('Examensimulatie','Exam simulation'):s.mode==='wrong'?tr('Foutenronde','Review'):tr('Leerstand','Study mode')}</span></div>
        <section class="result-hero"><div class="score-ring" style="--pct:${pct}%"><div><strong>${pct}%</strong><small>${good} ${tr('van','of')} ${s.ids.length}</small></div></div><div><div class="result-label">${tr('TOETS AFGEROND','TEST COMPLETED')}${s.timedOut?tr(' · TIJD VERSTREKEN',' · TIME EXPIRED'):''}</div><h2>${state.lang==='en'?({ 'Sterk resultaat':'Strong result','Goede basis, maar blijf oefenen':'Good foundation, keep practicing','Gerichte herhaling helpt':'Focused review will help'}[descriptor]||descriptor):descriptor}</h2><p>${s.timedOut?tr('De tijd is verstreken. Niet beantwoorde vragen tellen mee als onjuist. ','Time expired. Unanswered questions count as incorrect. '):''}${pct>=85?tr('Je begrijpt veel kernconcepten. Verifieer je niveau met nieuwe vragen en hands-on labs.','You understand many core concepts. Verify your knowledge with new questions and hands-on labs.'):pct>=70?tr('Je beheerst een deel van de stof, maar bekijk de missers en oefen vooral je zwakste domein.','You have learned some of the material. Review missed questions and focus on your weakest domain.'):tr('Oefen de onderstaande onderwerpen opnieuw en leg voor iedere vraag uit waarom de alternatieven afvallen.','Review the topics below and explain why the alternative answers are incorrect.')} ${tr('Dit is een','This is a')} <strong>${tr('oefenpercentage','practice percentage')}</strong>, ${tr('geen officiële Microsoft-examenscore.','not an official Microsoft exam score.')}</p></div></section>
        <div class="domain-summary">${domainRows.map(d=>`<div class="domain-panel"><h3>${safe(state.lang==='en'?({beheer:'Implement and manage an analytics solution',data:'Ingest and transform data',monitor:'Monitor and optimize an analytics solution'}[d.key]||d.label):d.label)}</h3><span class="rate">${d.pct}%</span><small> · ${d.ok}/${d.n} ${tr('goed','correct')}</small><div class="progress-mini"><span style="width:${d.pct}%"></span></div></div>`).join('')}</div>
        <div class="result-actions"><button class="primary" type="button" id="again">${tr('Nieuwe toets starten →','Start a new practice →')}</button><button class="secondary" type="button" id="toggle-review">${state.review?tr('Verberg','Hide'):tr('Bekijk','Review')} ${tr('alle antwoorden en uitleg','all answers and explanations')}</button>${wrong.length&&s.mode!=='imported'?`<button class="soft" id="repeat-wrong" type="button">${tr('Herhaal fouten','Review mistakes')}</button>`:''}</div>
        ${wrong.length?`<section class="panel" style="margin-top:21px"><h3>${tr('Wat moet je herhalen?','What should you review?')}</h3>${wrong.slice(0,5).map(id=>`<div style="color:#aec6e1;font-size:13px;padding:6px 0;border-bottom:1px solid #2a415b"><strong style="color:#e8f3ff">${safe(localizedQuestion(BANK[id]).topic)}</strong> — ${safe(localizedQuestion(BANK[id]).stem.slice(0,84))}…</div>`).join('')}<p class="help">${tr('Open de antwoorden hieronder voor de uitleg en links naar Microsoft Learn.','Open the answers below for explanations and Microsoft Learn links.')}</p></section>`:''}
        <section id="review-section" ${state.review?'':'class="hidden"'} style="margin-top:29px"><div class="section-head"><h2>${tr('Antwoorden en uitleg','Answers and explanations')}</h2><p>${wrong.length} ${tr('fout of niet beantwoord','incorrect or unanswered')}</p></div><div class="review-list">${s.ids.map((id,index)=>{let q=localizedQuestion(BANK[id]),sel=s.answers[id]||[],correct=answered(s,id)&&isCorrect(q,sel);return `<article class="review"><div class="review-title"><span style="color:${correct?'#87eac2':'#ff9ca9'}">${correct?'✓':'✕'}</span> ${tr('Vraag','Question')} ${index+1} · ${safe(q.topic)} · ${safe(state.lang==='en'?({Basis:'Basic',Gevorderd:'Advanced',Examenniveau:'Exam level'}[q.level]||q.level):q.level)}</div><strong>${safe(q.stem)}</strong><details ${!correct?'open':''}><summary>${correct?tr('Toon uitleg','Show explanation'):tr('Bekijk juiste antwoord en uitleg','View correct answer and explanation')} ▾</summary>${q.correct.map(i=>`<div class="review-answer">✓ ${safe(q.options[i])}</div>`).join('')}${sel.length&&!correct?`<p class="review-incorrect">${tr('Jouw antwoord:','Your answer:')} ${sel.map(i=>safe(q.options[i])).join(' · ')}</p>`:!sel.length?`<p class="review-incorrect">${tr('Niet beantwoord','Unanswered')}</p>`:''}<p>${safe(q.explanation)}</p><div class="source">${sourceLink(q)}</div></details></article>`}).join('')}</div></section>
        </div>`;
      $('backhome').addEventListener('click',()=>{state.review=false;home();scrollTop()});$('again').addEventListener('click',()=>{state.review=false;home();scrollTop()});$('toggle-review').addEventListener('click',()=>{state.review=!state.review;let el=$('review-section');el.classList.toggle('hidden',!state.review);$('toggle-review').textContent=state.review?tr('Verberg alle antwoorden en uitleg','Hide all answers and explanations'):tr('Bekijk alle antwoorden en uitleg','Review all answers and explanations');if(state.review)el.scrollIntoView({behavior:'smooth',block:'start'})});
      if($('repeat-wrong'))$('repeat-wrong').addEventListener('click',()=>{state.mode='wrong';state.domain='all';state.level='all';state.count=90;state.review=false;home();scrollTop()});save();
    }
    document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;let s=state.session;if(!s||s.finished||s.screen!=='quiz')return;if(e.key>='1'&&e.key<='4'){let q=BANK[s.ids[s.index]];if(answered(s,q.id))return;let idx=s.orders[q.id][Number(e.key)-1];if(idx!==undefined)toggleChoice(idx)}else if(e.key==='Enter'){if(document.activeElement?.tagName==='BUTTON')return;let b=$('submit');if(b&&!b.disabled)b.click()}});
    $('brand').addEventListener('click',e=>{e.preventDefault();home()});
    $('language-toggle').textContent=state.lang==='nl'?'EN':'NL';
    $('language-toggle').addEventListener('click',()=>{state.lang=state.lang==='nl'?'en':'nl';localStorage.setItem('d7-lang',state.lang);syncHeader();syncFooter();if(state.session&&!state.session.finished&&state.session.screen==='quiz')drawQuiz();else if(state.session?.finished)results();else if(state.adminPage)adminPage();else if(state.about)aboutPage();else home()});
    $('about-link').addEventListener('click',e=>{e.preventDefault();aboutPage()});
    $('account-button').addEventListener('click',openAccount);
    $('account-dialog').addEventListener('click',e=>{if(e.target===$('account-dialog'))$('account-dialog').close()});
    state.user=currentUser()?.record||null;load();if(state.examId&&CERTS[state.examId]){QUESTIONS=state.examId==='dp700'?DP700_QUESTIONS:(window.EXTRA_QUESTION_BANKS?.[state.examId]||[]);QUESTIONS.forEach(q=>BANK[q.id]=q);DOMAINS=CERTS[state.examId].domains;}state.lang=localStorage.getItem('d7-lang')==='en'?'en':'nl';loadTranslations().then(async()=>{if(state.user){await refreshAuth();await loadImportedExams();await pullCloud();heartbeat()}if(!state.about&&!state.adminPage)home()});
  </script>
</body>
</html>
